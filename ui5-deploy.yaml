# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: ae.emsteel.asas.noteprint
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://vhemmedvci.sap.emsteel.com:44300/
          client: '120'
        app:
          name: ZZNOTEPRINT
          description: Note print
          package: $TMP
          transport: ''
        exclude:
          - /test/
